<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hydro Pressure Washing — Command Center</title>
<link rel="icon" type="image/png" href="../assets/favicon.png">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f6f8fb;
  --surface:#ffffff;
  --surface-2:#fbfcfe;
  --border:#e6eaf0;
  --border-strong:#d4dae4;
  --text:#1a2233;
  --text-2:#5b6577;
  --text-3:#8b95a7;
  --brand:#0a66cf;
  --brand-soft:#e8f1fd;
  --brand-2:#0846a0;
  --green:#12a150;
  --green-soft:#e6f6ec;
  --amber:#d98a00;
  --amber-soft:#fdf3e0;
  --red:#e0463c;
  --red-soft:#fdecea;
  --purple:#7c5cff;
  --purple-soft:#efeaff;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --shadow-md:0 4px 12px rgba(16,24,40,.08);
  --shadow-lg:0 12px 40px rgba(16,24,40,.16);
  --radius:14px;
  --radius-sm:10px;
  --sidebar-w:248px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
a{color:var(--brand);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d4dae4;border-radius:20px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#b9c1cf}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:40;transition:transform .25s ease}
.brand{display:flex;align-items:center;gap:11px;padding:20px 20px 16px}
.brand-logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--brand),#3d8bff);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;flex-shrink:0;box-shadow:0 4px 10px rgba(10,102,207,.3)}
.brand-name{font-weight:700;font-size:15px;letter-spacing:-.2px;line-height:1.1}
.brand-sub{font-size:11px;color:var(--text-3);font-weight:500}
.nav{flex:1;overflow-y:auto;padding:6px 12px 12px}
.nav-section{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-3);padding:14px 12px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:var(--text-2);font-weight:500;font-size:13.5px;width:100%;text-align:left;transition:all .12s;margin-bottom:1px;position:relative}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav-item .ico{width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.nav-item .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:20px;min-width:18px;text-align:center}
.nav-item.active .badge{background:var(--brand)}
.sync-box{margin:8px 12px 12px;padding:11px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;font-size:12px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--text-3);display:inline-block;margin-right:6px}
.sync-dot.on{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.sync-dot.off{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.sync-dot.err{background:var(--red);box-shadow:0 0 0 3px var(--red-soft)}

.main{flex:1;margin-left:var(--sidebar-w);display:flex;flex-direction:column;min-width:0}
.topbar{height:64px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 28px;position:sticky;top:0;z-index:30}
.topbar h1{font-size:19px;font-weight:700;letter-spacing:-.3px}
.topbar .sub{font-size:12.5px;color:var(--text-3);font-weight:500;margin-top:1px}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.hamburger{display:none}
.search-mini{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:7px 12px;width:230px;color:var(--text-3)}
.search-mini input{border:none;background:none;outline:none;width:100%;font-size:13px}
.content{flex:1;padding:26px 28px 60px;max-width:1400px;width:100%}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:9px;font-weight:600;font-size:13.5px;transition:all .13s;border:1px solid transparent;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 1px 2px rgba(10,102,207,.3)}
.btn-primary:hover{background:var(--brand-2)}
.btn-ghost{background:var(--surface);color:var(--text-2);border-color:var(--border-strong)}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-soft{background:var(--brand-soft);color:var(--brand)}
.btn-soft:hover{background:#dbe9fc}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn-danger:hover{background:#fbdad7}
.btn-sm{padding:6px 11px;font-size:12.5px}
.btn-icon{padding:8px;border-radius:8px;color:var(--text-3)}
.btn-icon:hover{background:var(--surface-2);color:var(--text)}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:20px}
.card-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)}
.card-head h3{font-size:15px;font-weight:700;letter-spacing:-.2px}
.card-head .sub{font-size:12.5px;color:var(--text-3)}

.grid{display:grid;gap:16px}
.kpi-grid{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .ki{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.kpi .kl{font-size:12.5px;color:var(--text-2);font-weight:600}
.kpi .kv{font-size:27px;font-weight:800;letter-spacing:-.8px;margin-top:3px}
.kpi .kd{font-size:12px;font-weight:600;margin-top:6px;display:flex;align-items:center;gap:4px}
.kd.up{color:var(--green)}.kd.down{color:var(--red)}.kd.flat{color:var(--text-3)}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3);padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2)}
td{padding:13px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr{transition:background .1s}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:none}
.row-click{cursor:pointer}

/* ---------- Chips / badges ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;letter-spacing:.2px}
.chip .d{width:6px;height:6px;border-radius:50%}
.chip-green{background:var(--green-soft);color:#0d7a3c}
.chip-amber{background:var(--amber-soft);color:#a86800}
.chip-red{background:var(--red-soft);color:#c0362d}
.chip-blue{background:var(--brand-soft);color:var(--brand-2)}
.chip-purple{background:var(--purple-soft);color:#5b3fd4}
.chip-gray{background:#eef1f5;color:var(--text-2)}

/* ---------- Forms ---------- */
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.field .hint{font-weight:400;color:var(--text-3);font-size:11.5px}
.input,select.input,textarea.input{width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:9px;background:var(--surface);transition:all .12s;outline:none}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.input{resize:vertical;min-height:80px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(16,24,40,.5);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .18s}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:640px;transform:translateY(12px) scale(.98);transition:transform .2s;margin:auto 0}
.modal-overlay.open .modal{transform:none}
.modal.wide{max-width:900px}
.modal-head{display:flex;align-items:center;padding:20px 24px;border-bottom:1px solid var(--border)}
.modal-head h2{font-size:17px;font-weight:700}
.modal-head .sub{font-size:12.5px;color:var(--text-3);margin-top:1px}
.modal-body{padding:22px 24px;max-height:65vh;overflow-y:auto}
.modal-foot{display:flex;align-items:center;gap:10px;padding:16px 24px;border-top:1px solid var(--border);background:var(--surface-2);border-radius:0 0 16px 16px}

/* ---------- Misc ---------- */
.page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head .ph-actions{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}
.section-title{font-size:15px;font-weight:700;margin-bottom:14px;letter-spacing:-.2px}
.empty{text-align:center;padding:48px 20px;color:var(--text-3)}
.empty .ei{font-size:40px;margin-bottom:12px;opacity:.5}
.empty h4{font-size:15px;color:var(--text-2);margin-bottom:5px}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.toolbar .spacer{flex:1}
.pill-tabs{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px}
.pill-tabs button{padding:6px 14px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--text-2)}
.pill-tabs button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.select-mini{padding:7px 11px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);font-weight:600;font-size:13px;outline:none}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.stat-inline{display:flex;gap:26px;flex-wrap:wrap}
.stat-inline .si-l{font-size:12px;color:var(--text-3);font-weight:600}
.stat-inline .si-v{font-size:19px;font-weight:800;letter-spacing:-.4px;margin-top:2px}
.divider{height:1px;background:var(--border);margin:18px 0}
.mono{font-variant-numeric:tabular-nums}

/* Toast */
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--text);color:#fff;padding:12px 18px;border-radius:10px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;animation:toastIn .25s;max-width:360px}
.toast.ok{background:#0d7a3c}.toast.err{background:#c0362d}.toast.info{background:var(--text)}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

/* Photo compare */
.photo-compare{position:relative;border-radius:12px;overflow:hidden;user-select:none;background:#eef1f5;aspect-ratio:4/3}
.photo-compare img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-compare .after-wrap{position:absolute;inset:0;overflow:hidden;width:50%}
.photo-compare .slider-line{position:absolute;top:0;bottom:0;width:3px;background:#fff;left:50%;transform:translateX(-50%);box-shadow:0 0 0 1px rgba(0,0,0,.1);cursor:ew-resize;z-index:3}
.photo-compare .slider-handle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center;cursor:ew-resize;z-index:4;color:var(--brand)}
.photo-compare .lbl{position:absolute;bottom:10px;padding:3px 10px;border-radius:20px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;z-index:2}
.photo-compare .lbl.b{left:10px}.photo-compare .lbl.a{right:10px}

/* Calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.cal-dow{background:var(--surface-2);padding:9px;text-align:center;font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.4px}
.cal-cell{background:var(--surface);min-height:104px;padding:7px 8px;position:relative;transition:background .1s;cursor:pointer}
.cal-cell:hover{background:var(--surface-2)}
.cal-cell.other{background:var(--surface-2);opacity:.55}
.cal-cell.today .cal-num{background:var(--brand);color:#fff}
.cal-num{font-size:12.5px;font-weight:600;color:var(--text-2);width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:7px;margin-bottom:4px}
.cal-ev{font-size:11px;font-weight:600;padding:3px 7px;border-radius:6px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}

.progress{height:7px;background:var(--surface-2);border-radius:20px;overflow:hidden;border:1px solid var(--border)}
.progress .bar{height:100%;border-radius:20px}

.price-card{border:1px solid var(--border);border-radius:12px;padding:0;overflow:hidden;transition:all .15s;background:var(--surface)}
.price-card:hover{box-shadow:var(--shadow-md);border-color:var(--border-strong)}
.price-head{padding:15px 17px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--border)}
.price-emoji{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.price-body{padding:15px 17px}
.price-rate{font-size:24px;font-weight:800;letter-spacing:-.6px}
.price-unit{font-size:13px;color:var(--text-3);font-weight:600}
.price-min{font-size:12px;color:var(--text-2);margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}

.calc-out{background:var(--brand-soft);border:1px solid #cfe0fa;border-radius:12px;padding:18px;text-align:center}
.calc-out .co-l{font-size:12px;color:var(--brand-2);font-weight:600}
.calc-out .co-v{font-size:32px;font-weight:800;color:var(--brand-2);letter-spacing:-1px}

.line-item{display:grid;grid-template-columns:1fr 90px 110px 120px 36px;gap:10px;align-items:center;margin-bottom:9px}
.line-item .input{padding:8px 10px}

.doc-preview{background:#fff;border:1px solid var(--border);border-radius:12px;padding:34px;font-size:13px;box-shadow:var(--shadow)}
.doc-preview .dp-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px}
.doc-preview table{margin:18px 0}
.doc-preview .dp-total{margin-left:auto;width:260px}
.doc-total-row{display:flex;justify-content:space-between;padding:6px 0}
.doc-total-row.grand{border-top:2px solid var(--text);margin-top:6px;padding-top:10px;font-size:17px;font-weight:800}

.setup-banner{background:linear-gradient(100deg,#fff8e8,#fef3d9);border:1px solid #f5d98a;border-radius:12px;padding:15px 18px;display:flex;align-items:center;gap:14px;margin-bottom:20px}
.setup-banner .sb-ico{font-size:22px}

/* Responsive */
@media(max-width:1000px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:var(--shadow-lg)}
  .main{margin-left:0}
  .hamburger{display:flex}
  .search-mini{display:none}
  .field-row,.field-row-3{grid-template-columns:1fr}
  .line-item{grid-template-columns:1fr;gap:6px;padding-bottom:12px;border-bottom:1px dashed var(--border);margin-bottom:12px}
  .content{padding:20px 16px 60px}
  .topbar{padding:0 16px}
}
.nav-backdrop{display:none;position:fixed;inset:0;background:rgba(16,24,40,.4);z-index:39}
.nav-backdrop.open{display:block}
[hidden]{display:none!important}
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .6s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style>
</head>
<body>
<!-- LOCK SCREEN -->
<div id="lockScreen" hidden style="position:fixed;inset:0;z-index:500;background:linear-gradient(135deg,#0a66cf,#0846a0);display:flex;align-items:center;justify-content:center;padding:20px">
  <form id="lockBox" onsubmit="return tryUnlock(event)" style="background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:34px 32px;width:100%;max-width:360px;text-align:center">
    <div style="width:58px;height:58px;border-radius:15px;background:linear-gradient(135deg,#0a66cf,#3d8bff);display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 16px">💧</div>
    <div style="font-size:19px;font-weight:800;letter-spacing:-.3px" id="lockTitle">Command Center</div>
    <div style="font-size:13px;color:#8b95a7;margin-top:3px;margin-bottom:22px">Enter your password to continue</div>
    <input id="lockPass" type="password" placeholder="Password" autocomplete="current-password"
      style="width:100%;padding:12px 14px;border:1px solid #d4dae4;border-radius:10px;font-size:15px;outline:none;text-align:center" onfocus="this.style.borderColor='#0a66cf'">
    <div id="lockErr" hidden style="color:#e0463c;font-size:12.5px;font-weight:600;margin-top:10px">Incorrect password</div>
    <button type="submit" style="width:100%;margin-top:16px;padding:12px;background:#0a66cf;color:#fff;border:none;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer">Unlock</button>
  </form>
</div>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">💧</div>
      <div>
        <div class="brand-name" id="bizName">Exterior Wash</div>
        <div class="brand-sub">Command Center</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sync-box">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <span><span class="sync-dot off" id="syncDot"></span><span id="syncText" style="font-weight:600">Local mode</span></span>
        <button class="btn-icon" onclick="openSettings()" title="Settings" style="padding:4px">⚙️</button>
      </div>
      <div id="syncSub" style="color:var(--text-3);margin-top:5px;font-size:11px">Data saved in this browser</div>
    </div>
  </aside>
  <div class="nav-backdrop" id="navBackdrop" onclick="toggleNav(false)"></div>

  <!-- MAIN -->
  <div class="main">
    <header class="topbar">
      <button class="hamburger btn-icon" onclick="toggleNav(true)" style="font-size:20px">☰</button>
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="sub" id="pageSub"></div>
      </div>
      <div class="topbar-actions">
        <div class="search-mini">
          <span>🔍</span><input id="globalSearch" placeholder="Search jobs, customers…" oninput="globalSearchHandler(this.value)">
        </div>
        <button class="btn btn-primary" onclick="quickAdd()"><span style="font-size:16px;line-height:1">＋</span> New Job</button>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBox"></div>
</div>
<div class="toast-wrap" id="toasts"></div>

<script>
/* =====================================================================
   EXTERIOR WASH LLC — COMMAND CENTER
   Single-file dashboard. Data layer: localStorage + optional Google
   Sheets sync via Google Apps Script Web App.
   ===================================================================== */

/* ---------------------------------------------------------------------
   1. STATE + PERSISTENCE
   ------------------------------------------------------------------- */
const LS_KEY = 'ewash_data_v1';
const CFG_KEY = 'ewash_cfg_v1';

/* --- HARDCODED CONNECTION (baked in so it works on every device) ---
   These are forced on every load, overriding anything saved in a
   browser. To change your backend later, edit these two lines and
   re-upload index.html to GitHub. */

const customer = id => DB.customers.find(c=>c.id===id);

function docTotal(doc){
  const sub = (doc.items||[]).reduce((s,i)=>s+(Number(i.qty)||0)*(Number(i.price)||0),0);
  const tax = sub*((Number(doc.taxRate)||0)/100);
  return {sub, tax, total:sub+tax};
}
function revenueStats(){
  const paid = DB.invoices.filter(i=>i.status==='paid');
  const outstanding = DB.invoices.filter(i=>i.status==='sent'||i.status==='overdue');
  const totalPaid = paid.reduce((s,i)=>s+docTotal(i).total,0);
  const totalOut = outstanding.reduce((s,i)=>s+docTotal(i).total,0);
  const jobsRev = DB.jobs.filter(j=>j.status==='completed').reduce((s,j)=>s+(Number(j.price)||0),0);
  const expenses = DB.expenses.reduce((s,e)=>s+(Number(e.amount)||0),0);
  const jobCosts = DB.jobs.filter(j=>j.status==='completed').reduce((s,j)=>s+(Number(j.cost)||0),0);
  return {totalPaid, totalOut, jobsRev, expenses, jobCosts, profit: jobsRev-expenses-jobCosts};
}
function monthlyRevenue(){
  // last 6 months of completed job revenue
  const now=new Date(); const out=[];
  for(let i=5;i>=0;i--){
    const dt=new Date(now.getFullYear(),now.getMonth()-i,1);
    const key=dt.toISOString().slice(0,7);
    const label=dt.toLocaleDateString('en-US',{month:'short'});
    const rev=DB.jobs.filter(j=>j.status==='completed'&&(j.date||'').slice(0,7)===key).reduce((s,j)=>s+(Number(j.price)||0),0);
    const exp=DB.expenses.filter(e=>(e.date||'').slice(0,7)===key).reduce((s,e)=>s+(Number(e.amount)||0),0);
    out.push({label,rev,exp});
  }
  return out;
}

/* ---------------------------------------------------------------------
   4. GOOGLE SHEETS SYNC (via Apps Script Web App)
   All requests go to CFG.apiUrl. We use text/plain POST bodies to avoid
   CORS preflight (Apps Script friendly). Actions: pull, push, ping,
   sendEmail, quoteLink.
   ------------------------------------------------------------------- */
function setSync(state, sub){
  syncState = state;
  const dot=document.getElementById('syncDot'), txt=document.getElementById('syncText'), sb=document.getElementById('syncSub');
  if(!dot) return;
  dot.className='sync-dot '+(state==='ok'?'on':state==='err'?'err':state==='syncing'?'off':'off');
  const map={ok:'Google Sheets ✓',syncing:'Syncing…',err:'Sync error',off:CFG.apiUrl?'Connected':'Local mode'};
  txt.textContent=map[state]||'Local mode';
  if(sub!==undefined) sb.textContent=sub;
  else sb.textContent = CFG.apiUrl ? (DB.meta.lastSync?('Last sync '+new Date(DB.meta.lastSync).toLocaleTimeString()):'Ready') : 'Data saved in this browser';
}

async function apiCall(action, payload={}){
  if(!CFG.apiUrl) throw new Error('No API URL configured');
  const body = JSON.stringify({action, secret:CFG.apiSecret, ...payload});
  const res = await fetch(CFG.apiUrl, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body
  });
  const text = await res.text();
  let json; try{ json=JSON.parse(text); }catch(e){ throw new Error('Bad response: '+text.slice(0,120)); }
  if(json.error) throw new Error(json.error);
  return json;
}

let pushTimer=null;
function pushSync(){
  // debounce
  clearTimeout(pushTimer);
  pushTimer=setTimeout(doPush, 1200);
}
async function doPush(){
  if(!CFG.apiUrl) return;
  setSync('syncing');
  try{
    // include business info in meta so the public quote page & owner
    // notifications can use it
    DB.meta = DB.meta || {};
    DB.meta.bizName = CFG.bizName; DB.meta.ownerEmail = CFG.email;
    DB.meta.phone = CFG.phone; DB.meta.currency = CFG.currency;
    await apiCall('push', {data: DB});
    DB.meta.lastSync=new Date().toISOString();
    localStorage.setItem(LS_KEY, JSON.stringify(DB));
    setSync('ok');
  }catch(e){ setSync('err', e.message); }
}
async function pullSync(silent){
  if(!CFG.apiUrl){ if(!silent) toast('Connect Google Sheets first in Settings','info'); return; }
  setSync('syncing');
  try{
    const r = await apiCall('pull');
    if(r.data && r.data.jobs){
      DB = r.data;
      const b=blankDB(); for(const k in b) if(DB[k]===undefined) DB[k]=b[k];
      DB.meta=DB.meta||{}; DB.meta.lastSync=new Date().toISOString();
      localStorage.setItem(LS_KEY, JSON.stringify(DB));
      setSync('ok'); render();
      if(!silent) toast('Pulled latest from Google Sheets','ok');
    } else { setSync('ok'); if(!silent) toast('Sheet is empty — pushed your local data','info'); doPush(); }
  }catch(e){ setSync('err', e.message); if(!silent) toast('Pull failed: '+e.message,'err'); }
}
async function testConnection(){
  try{
    const r=await apiCall('ping');
    return r.ok===true;
  }catch(e){ return false; }
}

function buildNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML = NAV.map(n=>{
    if(n.section) return `<div class="nav-section">${n.section}</div>`;
    let badge='';
    if(n.id==='requests'){ const r=(DB.requests||[]).filter(x=>x.status==='new').length; if(r)badge=`<span class="badge">${r}</span>`; }
    if(n.id==='schedule'){ const t=DB.jobs.filter(j=>j.status==='scheduled'&&daysUntil(j.date)!=null&&daysUntil(j.date)>=0&&daysUntil(j.date)<=2).length; if(t)badge=`<span class="badge">${t}</span>`; }
    if(n.id==='invoices'){ const o=DB.invoices.filter(i=>i.status==='sent'||i.status==='overdue').length; if(o)badge=`<span class="badge">${o}</span>`; }
    if(n.id==='quotes'){ const q=DB.quotes.filter(x=>x.status==='sent').length; if(q)badge=`<span class="badge">${q}</span>`; }
    return `<button class="nav-item ${ROUTE===n.id?'active':''}" onclick="go('${n.id}')"><span class="ico">${n.icon}</span>${n.label}${badge}</button>`;
  }).join('');
}

let scheduleMode='cal';
function calendarHTML(){
  const first=new Date(calYear,calMonth,1);
  const startDow=first.getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const monthName=first.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const cells=[];
  const prevDays=new Date(calYear,calMonth,0).getDate();
  for(let i=startDow-1;i>=0;i--) cells.push({day:prevDays-i,other:true});
  for(let d=1;d<=daysInMonth;d++) cells.push({day:d,other:false});
  while(cells.length%7) cells.push({day:cells.length-daysInMonth-startDow+1,other:true});
  const dows=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const t=new Date();
  return `
  <div class="card">
    <div class="card-head">
      <button class="btn-icon" onclick="calNav(-1)" style="font-size:18px">‹</button>
      <h3 style="min-width:190px;text-align:center">${monthName}</h3>
      <button class="btn-icon" onclick="calNav(1)" style="font-size:18px">›</button>
      <button class="btn btn-ghost btn-sm" onclick="calToday()" style="margin-left:8px">Today</button>
      <div style="margin-left:auto;display:flex;gap:14px;font-size:12px;color:var(--text-2)">
        <span><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--brand);margin-right:5px"></span>Scheduled</span>
        <span><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--green);margin-right:5px"></span>Completed</span>
      </div>
    </div>
    <div class="card-pad">
      <div class="cal-grid">
        ${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells.map(c=>{
          if(c.other) return `<div class="cal-cell other"></div>`;
          const dateStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(c.day).padStart(2,'0')}`;
          const isToday = t.getFullYear()===calYear && t.getMonth()===calMonth && t.getDate()===c.day;
          const jobs=DB.jobs.filter(j=>j.date===dateStr);
          return `<div class="cal-cell ${isToday?'today':''}" onclick="jobForm(null,'${dateStr}')">
            <div class="cal-num">${c.day}</div>
            ${jobs.slice(0,3).map(j=>{
              const bg=j.status==='completed'?'var(--green-soft)':j.status==='cancelled'?'#eef1f5':'var(--brand-soft)';
              const fg=j.status==='completed'?'#0d7a3c':j.status==='cancelled'?'var(--text-3)':'var(--brand-2)';
              return `<div class="cal-ev" style="background:${bg};color:${fg}" onclick="event.stopPropagation();openJob('${j.id}')">${j.time?j.time.slice(0,5)+' ':''}${esc(j.title)}</div>`;
            }).join('')}
            ${jobs.length>3?`<div style="font-size:10px;color:var(--text-3);font-weight:600;padding-left:4px">+${jobs.length-3} more</div>`:''}
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>`;
}
function calNav(d){ calMonth+=d; if(calMonth<0){calMonth=11;calYear--} if(calMonth>11){calMonth=0;calYear++} render(); }
function calToday(){ const t=new Date(); calMonth=t.getMonth(); calYear=t.getFullYear(); render(); }

function compareSlider(before, after){
  return `<div class="photo-compare" id="pcmp" onmousedown="startCompare(event)" ontouchstart="startCompare(event)">
    <img src="${before}" class="cmp-before">
    <div class="after-wrap" id="cmpAfter"><img src="${after}" style="width:200%;max-width:none"></div>

    <div class="slider-line" id="cmpLine"><div class="slider-handle">⟺</div></div>
  </div>`;
}
let _cmpDrag=false;
function startCompare(e){ _cmpDrag=true; moveCompare(e); }
function moveCompare(e){
  if(!_cmpDrag) return;
  const el=document.getElementById('pcmp'); if(!el) return;
  const rect=el.getBoundingClientRect();
  const x=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
  let pct=Math.max(0,Math.min(100,x/rect.width*100));
  document.getElementById('cmpAfter').style.width=pct+'%';
  document.getElementById('cmpLine').style.left=pct+'%';
  const img=document.querySelector('#cmpAfter img'); if(img) img.style.width=(100/pct*100)+'%';
}
document.addEventListener('mousemove',moveCompare);
document.addEventListener('touchmove',moveCompare);
document.addEventListener('mouseup',()=>_cmpDrag=false);
document.addEventListener('touchend',()=>_cmpDrag=false);

/* ---- Photo add/remove (with resize to keep storage small) ---- */
function addPhoto(jobId, kind){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.multiple=true;
  inp.onchange=async()=>{
    const j=DB.jobs.find(x=>x.id===jobId); if(!j) return;
    const key=kind==='before'?'beforePhotos':'afterPhotos';
    j[key]=j[key]||[];
    for(const f of inp.files){
      try{ const data=await resizeImage(f, 1280, .78); j[key].push(data); }
      catch(e){ toast('Could not read '+f.name,'err'); }
    }
    saveDB(); openJob(jobId); toast(inp.files.length+' photo(s) added','ok');
  };
  inp.click();
}
function removePhoto(jobId, kind, i){
  const j=DB.jobs.find(x=>x.id===jobId); if(!j) return;
  const key=kind==='before'?'beforePhotos':'afterPhotos';
  j[key].splice(i,1); saveDB(); openJob(jobId);
}
function resizeImage(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let{width:w,height:h}=img;
        if(w>h && w>maxDim){ h=h*maxDim/w; w=maxDim; }
        else if(h>maxDim){ w=w*maxDim/h; h=maxDim; }
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        resolve(cv.toDataURL('image/jpeg',quality));
      };
      img.onerror=reject; img.src=r.result;
    };
    r.onerror=reject; r.readAsDataURL(file);
  });
}
function lightbox(jobId,kind,i){
  const j=DB.jobs.find(x=>x.id===jobId); const arr=kind==='before'?j.beforePhotos:j.afterPhotos;
  openModal(`<div style="padding:10px;background:#111"><img src="${arr[i]}" style="width:100%;border-radius:8px;display:block"></div><div style="text-align:center;padding:10px"><button class="btn btn-ghost" onclick="openJob('${jobId}')">← Back to job</button></div>`, true);

/* ---- Send document via Apps Script ---- */
async function sendDoc(kind, id){
  const arr=kind==='quote'?DB.quotes:DB.invoices;
  const d=arr.find(x=>x.id===id); const c=customer(d.customerId);
  if(!c||!c.email) return toast('Customer has no email address','err');
  const btn=event&&event.target; if(btn){ btn.disabled=true; btn.innerHTML='<span class="spin"></span> Sending…'; }
  try{
    const t=docTotal(d);
    const acceptUrl = kind==='quote' ? quoteLink(d.token) : '';
    await apiCall('sendDoc', { kind, doc:d, customer:c, biz:CFG, acceptUrl, total:t.total });
    if(d.status==='draft'){ d.status='sent'; }
    saveDB();
    toast('Email sent to '+c.email,'ok');
    kind==='quote'?openQuote(id):openInvoice(id);
  }catch(e){ toast('Send failed: '+e.message,'err'); if(btn){btn.disabled=false;btn.innerHTML='✉️ Email';} }
}

function printDoc(){
  const html=document.getElementById('docPrint').outerHTML;
  const w=window.open('','_blank');

function runCalc(){
  const s=DB.services.find(x=>x.id===document.getElementById('calc_svc').value); if(!s) return;
  const mWrap=document.getElementById('calc_measure_wrap'), lbl=document.getElementById('calc_measure_lbl');
  if(s.type==='flat'){ mWrap.style.display='none'; }
  else { mWrap.style.display=''; lbl.textContent='Measurement ('+s.unit+')'; }
  const m=parseFloat(document.getElementById('calc_measure').value)||0;
  const adj=parseFloat(document.getElementById('calc_adj').value)||0;
  let base = s.type==='flat' ? s.rate : m*s.rate;
  base = base*(1+adj/100);
  let note='';
  if(s.min && base<s.min){ note=`Below ${fmtMoney0(s.min)} minimum — using minimum`; base=s.min; }
  else if(s.type!=='flat' && m) note=`${m} ${s.unit} × ${CFG.currency}${s.rate}${adj?` +${adj}%`:''}`;
  document.getElementById('calc_result').textContent=fmtMoney0(base);
  document.getElementById('calc_note').textContent=note;
  window._calcVal={name:s.name, price:Math.round(base)};
}

  const v=window._calcVal; if(!v||!v.price) return toast('Enter a measurement first','info');

function compareSliderStatic(before, after, jid){
  const uid2='pc_'+Math.random().toString(36).slice(2,8);
  return `<div class="photo-compare" id="${uid2}" onmousedown="startCompareG(event,'${uid2}')" ontouchstart="startCompareG(event,'${uid2}')">

let _gDrag=null;
function startCompareG(e,id){ _gDrag=id; moveCompareG(e); }
function moveCompareG(e){
  if(!_gDrag) return;
  const el=document.getElementById(_gDrag); if(!el) return;
  const rect=el.getBoundingClientRect();
  const x=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
  let pct=Math.max(2,Math.min(98,x/rect.width*100));
  el.querySelector('.after-wrap').style.width=pct+'%';
  el.querySelector('.slider-line').style.left=pct+'%';
  el.querySelector('.after-wrap img').style.width=(100/pct*100)+'%';
}
document.addEventListener('mousemove',moveCompareG);
document.addEventListener('touchmove',moveCompareG);
document.addEventListener('mouseup',()=>_gDrag=null);
document.addEventListener('touchend',()=>_gDrag=null);

async function savePassword(){
  const p1=document.getElementById('set_pass1').value;
  const p2=document.getElementById('set_pass2').value;
  if(!p1){
    if(CFG.passHash && !confirm('Remove the password lock? Anyone with the link will be able to open the dashboard.')) return;
    CFG.passHash=''; saveCfg();
    try{ sessionStorage.removeItem(SESSION_KEY); }catch(e){}
    toast('Password removed','ok'); render(); return;
  }
  if(p1!==p2) return toast('Passwords do not match','err');
  if(p1.length<4) return toast('Use at least 4 characters','err');
  CFG.passHash=await sha256(p1); saveCfg();
  try{ sessionStorage.setItem(SESSION_KEY, CFG.passHash); }catch(e){}  // stay logged in on this device
  toast('Password set — needed next time on other devices','ok'); render();
}
function saveSettings(){
  ['bizName','ownerName','email','phone','website','address','currency'].forEach(k=>CFG[k]=document.getElementById('set_'+k).value);

   dashboard private from anyone who finds the URL. Your real data is
   further protected by the Google Sheets secret.
   ------------------------------------------------------------------- */
async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function isUnlocked(){
  if(!CFG.passHash) return true;                       // no password set
  try{ return sessionStorage.getItem(SESSION_KEY)===CFG.passHash; }catch(e){ return false; }
}
function showLock(){
  document.querySelector('.app').style.display='none';
  const lock=document.getElementById('lockScreen');
  lock.hidden=false;
  setTimeout(()=>document.getElementById('lockPass').focus(),100);
}
async function tryUnlock(e){
  if(e) e.preventDefault();
  const val=document.getElementById('lockPass').value;
  const h=await sha256(val);
  if(h===CFG.passHash){
    try{ sessionStorage.setItem(SESSION_KEY, h); }catch(e){}
    document.getElementById('lockScreen').hidden=true;
    document.querySelector('.app').style.display='';
    startApp();
  }else{
    const box=document.getElementById('lockBox');
    box.style.animation='none'; void box.offsetWidth; box.style.animation='shake .4s';
    document.getElementById('lockErr').hidden=false;
    document.getElementById('lockPass').value='';
    document.getElementById('lockPass').focus();
  }
  return false;
}
function lockNow(){
  try{ sessionStorage.removeItem(SESSION_KEY); }catch(e){}
  location.reload();
}

function startApp(){
  setSync('off');
  if(CFG.apiUrl){ setSync('ok'); pullSync(true); }
  render();
}
function init(){
  CFG = loadCfg();
  DB  = loadDB();
  if(isUnlocked()){ startApp(); }
  else { showLock(); }
}
init();

</script>
