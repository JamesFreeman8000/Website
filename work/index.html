<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-JZFVGB2BL7"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-JZFVGB2BL7');</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Work | Hydro Pressure Washing — Before & After</title>
<meta name="description" content="See real before & after results from Hydro Pressure Washing across South Jersey — house washing, roofs, driveways, gutters, decks and commercial.">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/favicon.png">
<link rel="stylesheet" href="../assets/site.css">
<style>
.page-hero{background:linear-gradient(135deg,#0e1116,#16233b);color:#fff;padding:64px 0 60px;text-align:center}
.page-hero h1{font-size:clamp(30px,5vw,48px);font-weight:900;letter-spacing:-1.2px}
.page-hero p{color:#c3ccda;font-size:18px;margin-top:14px;max-width:620px;margin-left:auto;margin-right:auto}
/* Overview: two category sections per row (1 on mobile) */
.cat-columns{display:grid;grid-template-columns:1fr 1fr;gap:36px 40px}
@media(max-width:920px){.cat-columns{grid-template-columns:1fr;gap:28px}}
.cat-block{margin-bottom:8px}
.cat-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.cat-head .ci{width:50px;height:50px;border-radius:13px;background:var(--blue-l);display:flex;align-items:center;justify-content:center;font-size:25px;flex-shrink:0}
.cat-head h2{font-size:24px;font-weight:900;letter-spacing:-.5px}
.cat-head .cnt{color:var(--text-3);font-size:13.5px;font-weight:600}
.cat-head .see-more{margin-left:auto}
.work-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
/* On the filtered (See More) single-category page, cards can be a bit larger */
.single-cat .work-grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.work-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.work-card .cap{padding:13px 17px;font-weight:800;font-size:14.5px;display:flex;justify-content:space-between;align-items:center}
.work-card .cap .dt{color:var(--text-3);font-weight:600;font-size:12px}
.compare{position:relative;aspect-ratio:4/3;overflow:hidden;user-select:none;background:#eef1f5;cursor:ew-resize}
.compare img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.compare .after{overflow:hidden;width:50%}
.compare .after img{width:auto}
.compare .line{position:absolute;top:0;bottom:0;width:3px;background:#fff;left:50%;transform:translateX(-50%);box-shadow:0 0 6px rgba(0,0,0,.3);z-index:3}
.compare .handle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;color:var(--blue);z-index:4;font-size:14px}
.compare .tag{position:absolute;bottom:10px;padding:3px 10px;border-radius:20px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:800;z-index:2}
.compare .tag.b{left:10px}.compare .tag.a{right:10px}
.cat-note{background:var(--bg-2);border:1px dashed var(--border-strong,#d4dae4);border-radius:12px;padding:14px 18px;color:var(--text-3);font-size:13.5px;font-weight:600;text-align:center}
.loading{text-align:center;padding:60px 20px;color:var(--text-3)}
.spinner{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.back-link{display:inline-flex;align-items:center;gap:7px;color:var(--blue);font-weight:700;font-size:14.5px;margin-bottom:8px}
.filter-hero h1 span{color:#4b93ff}
</style>
</head>
<body>
<div id="site-nav"></div>

<header class="page-hero filter-hero">
  <div class="wrap">
    <h1 id="pageTitle">Our Work</h1>
    <p id="pageSub">Real results from real jobs across South Jersey. Drag the slider on any photo to reveal the before &amp; after.</p>
  </div>
</header>

<section class="section">
  <div class="wrap">
    <div id="workArea">
      <div class="loading"><div class="spinner"></div>Loading our latest work…</div>
    </div>
  </div>
</section>

<section class="section gray">
  <div class="wrap">
    <div class="cta-band">
      <h2>Want Results Like These?</h2>
      <p>Get your free quote today and let's make your property the next transformation.</p>
      <div class="btns">
        <a href="../contact/#quote" class="btn btn-primary btn-lg">Get My Free Quote →</a>
        <a href="tel:+16095451018" class="btn btn-ghost btn-lg">📞 Call or Text Us</a>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="../assets/site.js"></script>
<script src="../assets/config.js"></script>
<script>
HydroSite.render({base:'../', active:'work'});

/* ---- Categories: each has keywords that match a job's service names ---- */
// Order matters: more specific categories are matched FIRST so a job like
// "Roof Soft Wash" lands in Roof, not House. House is the catch-all last.
const CATEGORIES=[
  {key:'roof',       name:'Roof Cleaning',        icon:'🧼', keywords:['roof']},
  {key:'gutter',     name:'Gutter Cleaning',      icon:'🪣', keywords:['gutter']},
  {key:'concrete',   name:'Driveways & Concrete', icon:'🛣️', keywords:['driveway','concrete','sidewalk','patio']},
  {key:'deck',       name:'Decks & Fences',       icon:'🪵', keywords:['deck','fence','wood']},
  {key:'commercial', name:'Commercial',           icon:'🏢', keywords:['commercial','storefront','window']},
  {key:'house',      name:'House Washing',        icon:'🏠', keywords:['house','soft wash','siding','vinyl','stucco','exterior','pressure wash']}
];
// Display order for the overview (nice logical order, independent of match order)
const DISPLAY_ORDER=['house','roof','concrete','gutter','deck','commercial'];
const PREVIEW_COUNT=2;   // previews shown per category on the overview (2-per-row layout)

/* branded SVG placeholder tiles (no external images needed) */
function xmlEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function placeholderTile(label,variant){
  const bg = variant==='after' ? '#1f6fef' : '#3a4759';
  const l=xmlEsc(label);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${bg}"/><stop offset="1" stop-color="${variant==='after'?'#1558c9':'#2a3441'}"/></linearGradient></defs><rect width="400" height="300" fill="url(#g)"/><text x="50%" y="46%" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#fff" text-anchor="middle">${l}</text><text x="50%" y="58%" font-family="Arial,sans-serif" font-size="13" fill="#ffffffcc" text-anchor="middle">${variant.toUpperCase()}</text></svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}
function catPlaceholderPair(cat){
  return { title:cat.name, services:[cat.name], placeholder:true,
           before:placeholderTile(cat.name,'before'), after:placeholderTile(cat.name,'after'), date:'' };
}

function categorize(item){
  const svc=(item.services||[]).join(' ').toLowerCase()+' '+(item.title||'').toLowerCase();
  for(const c of CATEGORIES){ if(c.keywords.some(k=>svc.includes(k))) return c.key; }
  return 'house'; // sensible default bucket
}

let ALL_WORK=[];
async function loadWork(){
  try{
    const res=await fetch(window.HYDRO_API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'publicWork'})});
    const json=await res.json();
    ALL_WORK=(json&&json.work)||[];
  }catch(e){ ALL_WORK=[]; }
  // group real work by category
  const byCat={}; CATEGORIES.forEach(c=>byCat[c.key]=[]);
  ALL_WORK.forEach(w=>{ byCat[categorize(w)].push(w); });
  window._byCat=byCat;

  // If URL has ?cat=key -> show the single-category (See More) view
  const params=new URLSearchParams(location.search);
  const catKey=params.get('cat');
  if(catKey && CATEGORIES.find(c=>c.key===catKey)) renderCategoryPage(catKey, byCat);
  else renderOverview(byCat);
}

function cardHtml(w,i){
  const cap=(w.title||'Pressure Washing').replace(/</g,'&lt;');
  return `<div class="work-card">
    <div class="compare" id="cmp${i}" onmousedown="startCmp(event,${i})" ontouchstart="startCmp(event,${i})">
      <img src="${w.before}">
      <div class="after" id="aft${i}"><img src="${w.after}"></div>
      <span class="tag b">BEFORE</span><span class="tag a">AFTER</span>
      <div class="line" id="ln${i}"><div class="handle">⟺</div></div>
    </div>
    <div class="cap"><span>${cap}</span>${w.date?`<span class="dt">${w.date}</span>`:''}</div>
  </div>`;
}

let cmpItems=[];
function renderOverview(byCat){
  document.getElementById('pageTitle').textContent='Our Work';
  document.getElementById('pageSub').textContent='Real results from real jobs across South Jersey. Drag the slider on any photo to reveal the before & after.';
  cmpItems=[]; let idx=0; let html='<div class="cat-columns">';
  DISPLAY_ORDER.map(k=>CATEGORIES.find(c=>c.key===k)).forEach(cat=>{
    let items=byCat[cat.key]||[];
    const realCount=items.length;
    let preview = items.slice(0,PREVIEW_COUNT);
    let usingPlaceholder=false;
    if(!preview.length){ preview=[catPlaceholderPair(cat)]; usingPlaceholder=true; }
    html+=`<div class="cat-block">
      <div class="cat-head">
        <div class="ci">${cat.icon}</div>
        <div><h2>${cat.name}</h2><div class="cnt">${realCount?realCount+' project'+(realCount>1?'s':''):'Gallery being built'}</div></div>
        ${realCount>PREVIEW_COUNT?`<a href="?cat=${cat.key}" class="btn btn-soft see-more" style="background:var(--blue-l);color:var(--blue-d)">See More (${realCount}) →</a>`:''}
      </div>
      <div class="work-grid">${preview.map(w=>cardHtml(w,idx++)).join('')}</div>
      ${usingPlaceholder?`<div class="cat-note" style="margin-top:14px">📸 ${cat.name} gallery coming soon — photos will appear here as jobs are completed.</div>`:''}
    </div>`;
    preview.forEach(w=>cmpItems.push(w));
  });
  html+='</div>';
  document.getElementById('workArea').innerHTML=html;
  cmpItems.forEach((w,i)=>setCmp(i,50));
}

function renderCategoryPage(catKey, byCat){
  const cat=CATEGORIES.find(c=>c.key===catKey);
  const items=byCat[catKey]||[];
  document.getElementById('pageTitle').innerHTML=`${cat.icon} <span>${cat.name}</span>`;
  document.getElementById('pageSub').textContent=`Every ${cat.name.toLowerCase()} transformation we've completed. Drag any slider to see the difference.`;
  cmpItems=[]; let idx=0;
  let body=`<div class="single-cat"><a href="?" class="back-link">← Back to all work</a>`;
  if(items.length){
    body+=`<div class="work-grid" style="margin-top:8px">${items.map(w=>cardHtml(w,idx++)).join('')}</div>`;
    items.forEach(w=>cmpItems.push(w));
  }else{
    const pair=catPlaceholderPair(cat);
    body+=`<div class="work-grid" style="margin-top:8px">${cardHtml(pair,idx++)}</div>
      <div class="cat-note" style="margin-top:16px">📸 We're building out our ${cat.name.toLowerCase()} gallery. Check back soon — or <a href="../contact/#quote">get a free quote</a> to be our next transformation!</div>`;
    cmpItems.push(pair);
  }
  body+=`</div>`;
  document.getElementById('workArea').innerHTML=body;
  cmpItems.forEach((w,i)=>setCmp(i,50));
  window.scrollTo(0,0);
}

/* ---- slider mechanics ---- */
let drag=null;
function startCmp(e,i){drag=i;moveCmp(e);}
function moveCmp(e){
  if(drag===null)return;
  const el=document.getElementById('cmp'+drag);if(!el)return;
  const r=el.getBoundingClientRect();
  const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  setCmp(drag,Math.max(2,Math.min(98,x/r.width*100)));
}
function setCmp(i,pct){
  const el=document.getElementById('cmp'+i);if(!el)return;
  const aft=document.getElementById('aft'+i), ln=document.getElementById('ln'+i);
  if(!aft||!ln)return;
  aft.style.width=pct+'%'; ln.style.left=pct+'%';
  const img=aft.querySelector('img'); if(img) img.style.width=el.getBoundingClientRect().width+'px';
}
document.addEventListener('mousemove',moveCmp);
document.addEventListener('touchmove',moveCmp);
document.addEventListener('mouseup',()=>drag=null);
document.addEventListener('touchend',()=>drag=null);
window.addEventListener('resize',()=>cmpItems.forEach((w,i)=>{const aft=document.getElementById('aft'+i);const pct=aft?parseFloat(aft.style.width)||50:50;setCmp(i,pct);}));
loadWork();
</script>
</body>
</html>
